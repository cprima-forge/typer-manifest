name: Release

# Mirrors cprima-forge/cpmf-uiprc-diag's workflow, on main rather than develop.
#
# Until now this repository had no CI at all, which is how 0.2.1 came to be
# published from an uncommitted working tree and how two failing tests went
# unnoticed. Tests gate the publish; a tag is what releases.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      UV_SYSTEM_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      # --all-extras is required: pytest lives in
      # [project.optional-dependencies] dev, not a dependency group, so a bare
      # `uv run pytest` finds no pytest at all.
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      UV_SYSTEM_PYTHON: "1"
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v2
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Build distribution
        run: uv build
      - name: Install Twine >=6.1
        run: python -m pip install --upgrade "twine>=6.1.0"
      # Token first, trusted publishing as the fallback. The org secret
      # PYPI_API_TOKEN is granted to this repository by name.
      - name: Publish to PyPI (token)
        if: env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
      - name: Publish to PyPI (trusted publisher)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@v1.10.3
        with:
          packages-dir: dist
          verify-metadata: false
