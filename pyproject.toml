[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typer-manifest"
version = "0.2.0"
description = "Introspect Typer apps and export their full command manifest with pluggable renderers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christian Prior-Mamulyan" }]
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "click>=8.1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cprima-forge/typer-manifest"
Repository = "https://github.com/cprima-forge/typer-manifest"
Issues = "https://github.com/cprima-forge/typer-manifest/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
